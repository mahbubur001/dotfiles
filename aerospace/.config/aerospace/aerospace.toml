# AeroSpace config. Symlinked to ~/.config/aerospace/aerospace.toml.
# Missing keys fall back to default-config.toml.
# Commands: https://nikitabobko.github.io/AeroSpace/commands
# Guide:    https://nikitabobko.github.io/AeroSpace/guide

# Version 2: workspaces listed in 'persistent-workspaces' stay alive when empty
# (version 1 guessed them from the key bindings and warns on reload).
config-version = 2
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

start-at-login = true
after-startup-command = []

# Reload whenever this file is saved (needs one manual reload to kick in).
auto-reload-config = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
accordion-padding = 30
default-root-container-layout = 'tiles'          # tiles | accordion
default-root-container-orientation = 'auto'      # wide monitor -> horizontal, tall -> vertical

key-mapping.preset = 'qwerty'

# Mouse follows focus when the focused monitor changes:
# on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Turn Cmd+H (Hide app) into a no-op; hidden apps leave holes in the tiling.
# automatically-unhide-macos-hidden-apps = true

# Gaps between windows (inner) and monitor edges (outer).
# Per monitor: outer.top = [{ monitor.main = 16 }, 0]
[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

# ---------------------------------------------------------------------------
# Main mode
# ---------------------------------------------------------------------------
[mode.main.binding]
# Layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-shift-f = 'fullscreen'

# Focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move window
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize focused window
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Workspaces
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Send window to workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

alt-tab = 'workspace-back-and-forth'
# No effect on workspaces pinned in [workspace-to-monitor-force-assignment] (1-7)
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Modes
alt-shift-r = 'mode resize'
alt-shift-semicolon = 'mode service'

# ---------------------------------------------------------------------------
# Resize mode (alt-shift-r): hjkl / -= resize, b balances, enter / esc leave
# ---------------------------------------------------------------------------
[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
minus = 'resize smart -50'
equal = 'resize smart +50'
b = 'balance-sizes'
enter = 'mode main'
esc = 'mode main'

# ---------------------------------------------------------------------------
# Service mode (alt-shift-;): one shot, returns to main
# ---------------------------------------------------------------------------
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']           # reset layout
f = ['layout floating tiling', 'mode main']           # toggle floating / tiling
b = ['balance-sizes', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# ---------------------------------------------------------------------------
# Window rules (app ids: `aerospace list-apps`)
# ---------------------------------------------------------------------------

# Floating
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.finder || test %{app-bundle-id} = com.apple.TextEdit || test %{app-bundle-id} = com.apple.systempreferences || test %{app-bundle-id} = com.apple.calculator || test %{app-bundle-id} = com.apple.ActivityMonitor'
run = 'layout floating'

# Workspace 2: editor
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.microsoft.VSCode'
run = 'move-node-to-workspace 2'

# Workspace 3: chat
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.microsoft.teams2 || test %{app-bundle-id} = ru.keepcoder.Telegram || test %{app-bundle-id} = net.whatsapp.WhatsApp'
run = 'move-node-to-workspace 3'

# Workspace 5: terminal, preview
[[on-window-detected]]
if = 'test %{app-bundle-id} = dev.warp.Warp-Stable || test %{app-bundle-id} = com.apple.Preview'
run = 'move-node-to-workspace 5'

# Workspace 6: database
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.tinyapp.TablePlus'
run = 'move-node-to-workspace 6'

# Workspace 7: local sites, music
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.getflywheel.lightning.local || test %{app-bundle-id} = com.spotify.client'
run = 'move-node-to-workspace 7'

# ---------------------------------------------------------------------------
# Monitors: 1-3 on the main display, 4-7 on the second one
# ---------------------------------------------------------------------------
[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'secondary'
5 = 'secondary'
6 = 'secondary'
7 = 'secondary'
